name: Build single-speaker alphabet audio
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-alphabet-audio.yml'
permissions:
  contents: write
jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install audio processor
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Fetch public-domain single-woman alphabet reading
        shell: bash
        run: |
          set -euxo pipefail
          curl --fail --location --retry 3 --max-time 45 \
            --user-agent 'AlphabetCastle/1.0 (open educational project)' \
            'https://upload.wikimedia.org/wikipedia/commons/e/ef/English_alphabet_woman.oga' \
            -o /tmp/english-alphabet-woman.oga
          ffprobe -v error -show_entries format=duration,size -of json /tmp/english-alphabet-woman.oga
      - name: Verify 26 cuts and generate MP3 files
        run: python3 alphabet/tools/split_single_voice.py /tmp/english-alphabet-woman.oga alphabet/audio
      - name: Save checked audio to Pages branch
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add alphabet/audio
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Add validated A-Z recordings from one public-domain female speaker'
          git push origin HEAD:main
